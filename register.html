<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রেজিস্ট্রেশন - Kali Life</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Kali Life v2</h1>
        <nav>
            <a href="index.html" style="color: white; text-decoration: none; margin-left: 15px;">হোম</a>
            <a href="login.html" style="color: white; text-decoration: none; margin-left: 15px;">লগইন</a>
        </nav>
    </header>

    <div class="container" style="max-width: 400px;">
        <div class="card">
            <h2>নতুন অ্যাকাউন্ট তৈরি করুন</h2>
            <form id="registerForm">
                <label for="email">ইমেইল:</label>
                <input type="email" id="email" required placeholder="আপনার ইমেইল লিখুন">

                <label for="password">পাসওয়ার্ড:</label>
                <input type="password" id="password" required placeholder="কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড">

                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">রেজিস্ট্রার করুন</button>
            </form>
            <p style="margin-top: 1rem; text-align: center;">আগে থেকেই অ্যাকাউন্ট আছে? <a href="login.html">লগইন করুন</a></p>
        </div>
    </div>

</body>
</html>
