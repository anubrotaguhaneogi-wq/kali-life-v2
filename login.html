<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - Kali Life</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Kali Life v2</h1>
        <nav>
            <a href="index.html" style="color: white; text-decoration: none; margin-left: 15px;">হোম</a>
            <a href="register.html" style="color: white; text-decoration: none; margin-left: 15px;">রেজিস্ট্রেশন</a>
        </nav>
    </header>

    <div class="container" style="max-width: 400px;">
        <div class="card">
            <h2>লগইন করুন</h2>
            <form id="loginForm">
                <label for="email">ইমেইল:</label>
                <input type="email" id="email" required placeholder="আপনার ইমেইল লিখুন">

                <label for="password">পাসওয়ার্ড:</label>
                <input type="password" id="password" required placeholder="আপনার পাসওয়ার্ড দিন">

                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">লগইন</button>
            </form>
            <p style="margin-top: 1rem; text-align: center;">অ্যাকাউন্ট নেই? <a href="register.html">রেজিস্ট্রার করুন</a></p>
        </div>
    </div>

</body>
</html>
